[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-research"
version = "0.1.0"
description = "Cross-market equity research, liquidity, capacity, and index replication framework"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
duckdb = ["duckdb>=1.1"]

[project.scripts]
market-research = "market_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
